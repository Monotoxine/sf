<template>
    <lightning-card >

        <div class="slds-p-around_medium">
            <lightning-progress-indicator current-step={currentStep} type="path" variant="base">
                <lightning-progress-step label="Upload CSV" value="1"></lightning-progress-step>
                <lightning-progress-step label="Select Objects" value="2"></lightning-progress-step>
                <lightning-progress-step label="Review &amp; Extract" value="3"></lightning-progress-step>
            </lightning-progress-indicator>
        </div>

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
        </template>

        <div class="slds-p-around_medium">

            <template if:true={isStep1}>
                <div class="step-container">
                    <h2 class="slds-text-heading_medium slds-m-bottom_medium">
                        Step 1: Upload CSV File
                    </h2>

                    <p class="slds-m-bottom_medium">
                        Upload a CSV file where the first column header is <b>TEKCO_DataMigrationId__c</b>.
                    </p>

                    <lightning-input
                        type="file"
                        label="Select CSV File"
                        accept=".csv"
                        onchange={handleFileUpload}
                    ></lightning-input>

                    <template if:true={uploadedFileName}>
                        <div class="slds-m-top_medium">
                            <lightning-badge label={uploadedFileName}></lightning-badge>
                            <p class="slds-m-top_small slds-text-color_success">
                                {idCountText}
                            </p>
                        </div>
                    </template>
                </div>
            </template>

            <template if:true={isStep2}>
                <div class="step-container">
                    <h2 class="slds-text-heading_medium slds-m-bottom_medium">
                        Step 2: Select Master &amp; Child Objects
                    </h2>

                    <div class="slds-m-bottom_medium">
                        <lightning-combobox
                            name="masterObject"
                            label="Master Object *"
                            placeholder="Select master object manually"
                            options={masterObjects}
                            value={selectedMasterObject}
                            onchange={handleMasterObjectChange}
                            required
                        ></lightning-combobox>
                        <p class="help-text">
                            Select the object that corresponds to the DataMigration IDs provided in your CSV.
                        </p>
                    </div>

                    <template if:true={hasChildObjects}>
                        <div class="slds-m-bottom_medium">
                            <label class="slds-form-element__label">
                                Child Objects (Optional)
                            </label>
                            
                            <div class="slds-box child-tree-container">
                                <template if:true={flattenedTree}>
                                    <template for:each={flattenedTree} for:item="node">
                                        <div key={node.id} class="tree-node" style={node.indentStyle}>
                                            <lightning-button-icon
                                                if:true={node.children}
                                                icon-name={node.chevronIcon}
                                                alternative-text="Expand"
                                                variant="bare"
                                                size="x-small"
                                                data-node-id={node.id}
                                                onclick={handleExpandNode}
                                                class="expand-btn"
                                            ></lightning-button-icon>

                                            <lightning-input
                                                type="checkbox"
                                                label={node.objectLabel}
                                                checked={node.isSelected}
                                                data-node-id={node.id}
                                                onchange={handleChildToggle}
                                                class="child-checkbox"
                                            ></lightning-input>

                                            <span class="relationship-info slds-m-left_small slds-text-color_weak slds-text-body_small">
                                                ({node.relationshipType}: {node.relationshipLabel})
                                            </span>
                                        </div>
                                    </template>
                                </template>
                            </div>

                            <template if:true={selectedChildrenCount}>
                                <p class="help-text slds-text-color_success slds-m-top_small">
                                    {selectedChildrenCount} child object(s) selected
                                </p>
                            </template>
                        </div>
                    </template>

                    <div class="slds-m-top_large button-group">
                        <lightning-button
                            label="Previous"
                            onclick={handlePrevious}
                        ></lightning-button>
                        <lightning-button
                            variant="brand"
                            label="Next"
                            onclick={handleNext}
                            disabled={canProceedStep2}
                            class="slds-m-left_small"
                        ></lightning-button>
                    </div>
                </div>
            </template>

            <template if:true={isStep3}>
                <div class="step-container">
                    <h2 class="slds-text-heading_medium slds-m-bottom_medium">
                        Step 3: Review &amp; Extract
                    </h2>

                    <template if:false={extractionComplete}>
                        <div class="slds-box slds-m-bottom_medium">
                            <dl class="slds-dl_horizontal">
                                <dt class="slds-dl_horizontal__label">CSV File:</dt>
                                <dd class="slds-dl_horizontal__detail">{uploadedFileName}</dd>

                                <dt class="slds-dl_horizontal__label">IDs Count:</dt>
                                <dd class="slds-dl_horizontal__detail">{parsedIds.length}</dd>

                                <dt class="slds-dl_horizontal__label">Master Object:</dt>
                                <dd class="slds-dl_horizontal__detail">{selectedMasterObject}</dd>

                                <dt class="slds-dl_horizontal__label">Child Objects:</dt>
                                <dd class="slds-dl_horizontal__detail">
                                    <template if:true={selectedChildrenCount}>
                                        {selectedChildrenCount} selected
                                    </template>
                                    <template if:false={selectedChildrenCount}>None</template>
                                </dd>
                            </dl>
                        </div>

                        <template if:true={isExtracting}>
                            <div class="slds-align_absolute-center slds-m-top_large">
                                <p>Extracting data...</p>
                            </div>
                        </template>

                        <div class="slds-m-top_large button-group">
                            <lightning-button
                                label="Previous"
                                onclick={handlePrevious}
                                disabled={isExtracting}
                            ></lightning-button>
                            <lightning-button
                                variant="brand"
                                label="Extract &amp; Download"
                                icon-name="utility:download"
                                onclick={handleDownload}
                                disabled={canLaunchExtraction}
                                class="slds-m-left_small"
                            ></lightning-button>
                        </div>
                    </template>

                    <template if:true={extractionComplete}>
                        <div class="slds-notify slds-notify_alert slds-theme_success" role="alert">
                            <h2>✓ Extraction completed! Files downloaded.</h2>
                        </div>
                        <div class="slds-m-top_medium">
                            <p>{extractionSummary}</p>
                        </div>
                        <div class="slds-m-top_large">
                            <lightning-button
                                variant="brand"
                                label="Start New Extraction"
                                onclick={handleReset}
                            ></lightning-button>
                        </div>
                    </template>
                </div>
            </template>

        </div>
    </lightning-card>
</template>

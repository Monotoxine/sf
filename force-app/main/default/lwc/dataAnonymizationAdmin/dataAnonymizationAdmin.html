<template>
    <lightning-card title="Data Anonymization Admin" icon-name="utility:shield">

        <!-- Permission warning -->
        <template if:true={permissionWarning}>
            <div class="slds-notify slds-notify_alert slds-theme_error slds-m-around_medium" role="alert">
                <span class="slds-assistive-text">Error</span>
                <lightning-icon icon-name="utility:error" size="small" class="slds-m-right_x-small"></lightning-icon>
                {permissionWarning}
            </div>
        </template>

        <div class="slds-p-around_medium">

            <!-- ─── Filters ──────────────────────────────────────────────── -->
            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                <div class="slds-col slds-size_1-of-3">
                    <lightning-combobox
                        label="Brand"
                        placeholder="-- All Brands --"
                        options={brandOptions}
                        value={selectedBrand}
                        onchange={handleBrandChange}>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-3">
                    <lightning-combobox
                        label="Object"
                        placeholder="-- All Objects --"
                        options={objectOptions}
                        value={selectedObject}
                        onchange={handleObjectChange}>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-3 slds-align-bottom">
                    <lightning-button
                        label="Preview"
                        icon-name="utility:preview"
                        onclick={handlePreview}
                        class="slds-m-right_small">
                    </lightning-button>
                </div>
            </div>

            <!-- ─── Preview Panel ────────────────────────────────────────── -->
            <template if:true={isLoadingPreview}>
                <lightning-spinner alternative-text="Loading preview..." size="small"></lightning-spinner>
            </template>

            <template if:true={hasPreview}>
                <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                    <h3 class="slds-text-heading_small slds-m-bottom_small">Anonymization Scope Preview</h3>
                    <template for:each={previewByObject} for:item="obj">
                        <div key={obj.objectApiName} class="slds-grid slds-gutters slds-m-bottom_x-small">
                            <div class="slds-col slds-size_1-of-3">
                                <strong>{obj.objectApiName}</strong>
                            </div>
                            <div class="slds-col slds-size_2-of-3">
                                <span class="slds-badge">{obj.count} records</span>
                                <span class="slds-m-left_x-small slds-text-color_weak">{obj.countLabel}</span>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <!-- ─── Field Config Table ───────────────────────────────────── -->
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading field configs..." size="small"></lightning-spinner>
            </template>

            <template if:true={hasFieldConfigs}>
                <div class="slds-m-bottom_medium">
                    <h3 class="slds-text-heading_small slds-m-bottom_small">Fields to be Anonymized</h3>
                    <template for:each={fieldConfigsByObject} for:item="group">
                        <div key={group.objectApiName} class="slds-m-bottom_small">
                            <div class="slds-text-title_caps slds-m-bottom_xx-small">{group.objectApiName}</div>
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th scope="col"><div class="slds-truncate">Field</div></th>
                                        <th scope="col"><div class="slds-truncate">Pattern Type</div></th>
                                        <th scope="col"><div class="slds-truncate">Description</div></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={group.fields} for:item="field">
                                        <tr key={field.fieldApiName}>
                                            <td><div class="slds-truncate">{field.fieldApiName}</div></td>
                                            <td><div class="slds-truncate">
                                                <span class="slds-badge">{field.patternType}</span>
                                            </div></td>
                                            <td><div class="slds-truncate">{field.patternDescription}</div></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                </div>
            </template>

            <!-- ─── Error Message ────────────────────────────────────────── -->
            <template if:true={errorMessage}>
                <div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_medium" role="alert">
                    <lightning-icon icon-name="utility:error" size="small" class="slds-m-right_x-small"></lightning-icon>
                    {errorMessage}
                </div>
            </template>

            <!-- ─── Launch Button ────────────────────────────────────────── -->
            <div class="slds-m-bottom_large">
                <lightning-button
                    label={startButtonLabel}
                    variant="destructive"
                    icon-name="utility:shield"
                    disabled={startButtonDisabled}
                    onclick={handleStart}>
                </lightning-button>
                <template if:true={isRunning}>
                    <lightning-spinner alternative-text="Running..." size="small" class="slds-m-left_small"></lightning-spinner>
                </template>
            </div>

            <!-- ─── Audit Log ─────────────────────────────────────────────── -->
            <div class="slds-m-top_large">
                <div class="slds-grid slds-gutters slds-m-bottom_small">
                    <div class="slds-col">
                        <h3 class="slds-text-heading_small">Recent Anonymization Runs</h3>
                    </div>
                    <div class="slds-col slds-no-flex">
                        <lightning-button-icon
                            icon-name="utility:refresh"
                            alternative-text="Refresh logs"
                            onclick={handleRefreshLogs}>
                        </lightning-button-icon>
                    </div>
                </div>

                <template if:true={hasAuditLogs}>
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col"><div class="slds-truncate">Log #</div></th>
                                <th scope="col"><div class="slds-truncate">Object(s)</div></th>
                                <th scope="col"><div class="slds-truncate">Brand</div></th>
                                <th scope="col"><div class="slds-truncate">Status</div></th>
                                <th scope="col"><div class="slds-truncate">Processed</div></th>
                                <th scope="col"><div class="slds-truncate">Failed</div></th>
                                <th scope="col"><div class="slds-truncate">Triggered By</div></th>
                                <th scope="col"><div class="slds-truncate">Started</div></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={auditLogs} for:item="log">
                                <tr key={log.Id}>
                                    <td><div class="slds-truncate">{log.Name}</div></td>
                                    <td><div class="slds-truncate">{log.Object_API_Name__c}</div></td>
                                    <td><div class="slds-truncate">{log.Brand_Filter__c}</div></td>
                                    <td><div class="slds-truncate">
                                        <span class={log.statusClass}>{log.Status__c}</span>
                                    </div></td>
                                    <td><div class="slds-truncate">{log.Records_Processed__c}</div></td>
                                    <td><div class="slds-truncate">{log.Records_Failed__c}</div></td>
                                    <td><div class="slds-truncate">{log.Triggered_By__r.Name}</div></td>
                                    <td><div class="slds-truncate">{log.startTimeFormatted}</div></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>

                <template if:false={hasAuditLogs}>
                    <p class="slds-text-color_weak slds-m-top_small">No anonymization runs yet.</p>
                </template>
            </div>

        </div>
    </lightning-card>
</template>

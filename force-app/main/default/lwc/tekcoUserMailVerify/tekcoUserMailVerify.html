<template>
  <lightning-card title="User Mail Verify" icon-name="standard:email">
    <div class="slds-var-p-horizontal_medium slds-var-p-bottom_medium">
      <div class="umv-filters">
        <lightning-dual-listbox
          data-id="brands"
          name="brands"
          label="Brands"
          source-label="Available"
          selected-label="Selected"
          size="6"
          options={brandOptions}
          value={selectedBrands}
          onchange={handleBrandChange}
        ></lightning-dual-listbox>

        <lightning-combobox
          class="slds-var-m-top_x-small"
          data-id="verification"
          name="verification"
          label="Status"
          options={verificationOptions}
          value={verificationFilter}
          onchange={handleVerificationChange}
        ></lightning-combobox>

        <lightning-combobox
          class="slds-var-m-top_x-small"
          data-id="suffix"
          name="suffix"
          label="Address"
          options={suffixOptions}
          value={suffixFilter}
          onchange={handleSuffixChange}
        ></lightning-combobox>
      </div>

      <template if:true={hasNoBrands}>
        <div class="slds-var-m-top_small slds-text-color_weak">
          No brand value is available. Check that User.TEKCO_Brand__c exists and
          that its value set has active entries.
        </div>
      </template>

      <template if:true={errorMessage}>
        <div class="slds-var-m-top_small slds-text-color_error" role="alert">
          {errorMessage}
        </div>
      </template>

      <template if:true={isLoading}>
        <div class="slds-var-m-top_medium slds-align_absolute-center">
          <lightning-spinner
            alternative-text="Loading users"
            size="small"
          ></lightning-spinner>
        </div>
      </template>

      <template if:true={showEmptyState}>
        <div class="slds-var-m-top_medium slds-text-color_weak">
          No user matches this brand and status.
        </div>
      </template>

      <template if:true={hasRows}>
        <template if:true={isTruncated}>
          <div class="slds-var-m-top_small slds-text-color_weak umv-truncation">
            {truncationMessage}
          </div>
        </template>

        <div class="umv-search-row slds-var-m-top_medium">
          <div class="umv-search">
            <lightning-input
              data-id="search"
              type="search"
              label="Search"
              variant="label-hidden"
              placeholder="Search this list"
              value={searchTerm}
              onchange={handleSearch}
            ></lightning-input>
          </div>
        </div>

        <template if:true={hasNoMatch}>
          <div class="slds-var-m-top_x-small slds-text-color_weak">
            No user matches this search.
          </div>
        </template>

        <div class="slds-var-m-top_xx-small umv-table">
          <lightning-datatable
            key-field="id"
            data={filteredRows}
            columns={columns}
            selected-rows={selectedIds}
            onrowselection={handleRowSelection}
          ></lightning-datatable>
        </div>

        <div
          class="slds-var-m-top_small slds-grid slds-grid_vertical-align-center slds-wrap"
        >
          <span class="slds-text-body_small slds-var-m-right_medium">
            {selectionSummary}
          </span>

          <lightning-button
            class="slds-var-m-right_x-small"
            label="Refresh"
            onclick={handleRefresh}
            disabled={isLoading}
          ></lightning-button>

          <lightning-button
            class="slds-var-m-right_x-small"
            variant="brand"
            label="Verify"
            onclick={handleVerify}
            disabled={isActionDisabled}
          ></lightning-button>

          <template if:true={isSandbox}>
            <lightning-button
              variant="destructive"
              label="Verify and reset password"
              onclick={handleReset}
              disabled={isActionDisabled}
            ></lightning-button>
          </template>
        </div>

        <template if:true={isOverCap}>
          <div class="slds-var-m-top_x-small slds-text-color_error">
            Selection exceeds the per-run limit. Reduce it before launching.
          </div>
        </template>
      </template>
    </div>
  </lightning-card>
</template>

<template>
    <lightning-card title="Data Anonymization Admin" icon-name="utility:shield">

        <lightning-tabset>

        <!-- ════════════════════════════════════════════════════════════════════
             TAB 1 — By Criteria (existing behaviour, untouched)
             ════════════════════════════════════════════════════════════════════ -->
        <lightning-tab label="By Criteria">

        <!-- Permission warning -->
        <template if:true={permissionWarning}>
            <div class="slds-notify slds-notify_alert slds-theme_error slds-m-around_medium" role="alert">
                <lightning-icon icon-name="utility:error" size="small" class="slds-m-right_x-small"></lightning-icon>
                {permissionWarning}
            </div>
        </template>

        <div class="slds-p-around_medium">

            <!-- ── Filters ──────────────────────────────────────────────── -->
            <div class="slds-grid slds-gutters slds-m-bottom_medium slds-wrap">

                <!-- Brand multi-select -->
                <div class="slds-col slds-size_1-of-3">
                    <div class="slds-form-element">
                        <div class="slds-grid slds-grid_align-spread">
                            <label class="slds-form-element__label">Brands</label>
                            <lightning-button
                                label="Select All"
                                variant="base"
                                class="slds-m-bottom_xx-small"
                                onclick={handleSelectAllBrands}>
                            </lightning-button>
                        </div>
                        <lightning-dual-listbox
                            name="brands"
                            source-label="Available"
                            selected-label="Selected"
                            options={brandOptions}
                            value={selectedBrands}
                            onchange={handleBrandChange}
                            size="5">
                        </lightning-dual-listbox>
                    </div>
                </div>

                <!-- Object multi-select -->
                <div class="slds-col slds-size_1-of-3">
                    <div class="slds-form-element">
                        <div class="slds-grid slds-grid_align-spread">
                            <label class="slds-form-element__label">Objects</label>
                            <lightning-button
                                label="Select All"
                                variant="base"
                                class="slds-m-bottom_xx-small"
                                onclick={handleSelectAllObjects}>
                            </lightning-button>
                        </div>
                        <lightning-dual-listbox
                            name="objects"
                            source-label="Available"
                            selected-label="Selected"
                            options={objectOptions}
                            value={selectedObjects}
                            onchange={handleObjectChange}
                            size="5">
                        </lightning-dual-listbox>
                    </div>
                </div>

                <!-- Record Type multi-select (visible only when RT-specific configs exist) -->
                <div class="slds-col slds-size_1-of-3">
                    <template if:true={hasRecordTypeOptions}>
                        <div class="slds-form-element">
                            <div class="slds-grid slds-grid_align-spread">
                                <label class="slds-form-element__label">Record Types</label>
                                <lightning-button
                                    label="Select All"
                                    variant="base"
                                    class="slds-m-bottom_xx-small"
                                    onclick={handleSelectAllRecordTypes}>
                                </lightning-button>
                            </div>
                            <lightning-dual-listbox
                                name="recordTypes"
                                source-label="Available"
                                selected-label="Selected"
                                options={recordTypeOptions}
                                value={selectedRecordTypes}
                                onchange={handleRecordTypeChange}
                                size="5">
                            </lightning-dual-listbox>
                            <p class="slds-form-element__help slds-m-top_xx-small">
                                Leave empty to process all Record Types.
                            </p>
                        </div>
                    </template>
                    <template if:false={hasRecordTypeOptions}>
                        <div class="slds-form-element">
                            <label class="slds-form-element__label">Record Types</label>
                            <p class="slds-text-color_weak slds-m-top_x-small">
                                No Record Type-specific configs for the selected object(s).
                            </p>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Preview button -->
            <div class="slds-m-bottom_medium">
                <lightning-button
                    label="Preview Scope"
                    icon-name="utility:preview"
                    onclick={handlePreview}>
                </lightning-button>
            </div>

            <!-- ── Preview panel ─────────────────────────────────────────── -->
            <template if:true={isLoadingPreview}>
                <lightning-spinner alternative-text="Loading preview..." size="small"></lightning-spinner>
            </template>

            <template if:true={hasPreview}>
                <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                    <h3 class="slds-text-heading_small slds-m-bottom_small">Scope Preview</h3>
                    <template if:true={previewNote}>
                        <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">{previewNote}</p>
                    </template>
                    <template for:each={previewByObject} for:item="obj">
                        <div key={obj.objectApiName} class="slds-grid slds-m-bottom_xx-small">
                            <div class="slds-col slds-size_1-of-3">
                                <strong>{obj.objectApiName}</strong>
                            </div>
                            <div class="slds-col">
                                <template if:true={obj.isContentDocOnly}>
                                    <span class="slds-badge slds-badge_inverse">{obj.countLabel}</span>
                                </template>
                                <template if:false={obj.isContentDocOnly}>
                                    <span class="slds-badge">{obj.countLabel}</span>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <!-- ── Field config table ────────────────────────────────────── -->
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading..." size="small"></lightning-spinner>
            </template>

            <template if:true={hasFieldConfigs}>
                <div class="slds-m-bottom_medium">
                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                        <h3 class="slds-text-heading_small">
                            Fields to Anonymize
                            <span class="slds-text-body_small slds-text-color_weak slds-m-left_x-small">
                                (uncheck to bypass a field for this run)
                            </span>
                        </h3>
                        <div class="slds-text-body_small">
                            <span class="slds-m-right_medium">
                                Run:
                                <lightning-button label="Select All" variant="base" onclick={handleSelectAllRun}></lightning-button>
                                /
                                <lightning-button label="Deselect All" variant="base" onclick={handleDeselectAllRun}></lightning-button>
                            </span>
                            <span>
                                Del. History:
                                <lightning-button label="Select All" variant="base" onclick={handleSelectAllHistory}></lightning-button>
                                /
                                <lightning-button label="Deselect All" variant="base" onclick={handleDeselectAllHistory}></lightning-button>
                            </span>
                        </div>
                    </div>
                    <div class="slds-grid slds-gutters_x-small slds-m-bottom_small">
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-input
                                type="search"
                                label="Filter by field name"
                                placeholder="Type to filter..."
                                value={fieldFilterText}
                                onchange={handleFieldFilterChange}>
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-combobox
                                label="Filter by Record Type"
                                value={fieldFilterRT}
                                options={fieldFilterRtOptions}
                                onchange={handleFieldFilterRtChange}>
                            </lightning-combobox>
                        </div>
                    </div>
                    <template for:each={fieldConfigsByObject} for:item="group">
                        <div key={group.objectApiName} class="slds-m-bottom_small">
                            <p class="slds-text-title_caps slds-m-bottom_xx-small">{group.objectApiName}</p>
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th style="width:3rem"><div class="slds-truncate">Run</div></th>
                                        <th><div class="slds-truncate">Field</div></th>
                                        <th><div class="slds-truncate">Pattern</div></th>
                                        <th><div class="slds-truncate">Record Type</div></th>
                                        <th><div class="slds-truncate">Del. History</div></th>
                                        <th><div class="slds-truncate">Description</div></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={group.fields} for:item="field">
                                        <tr key={field.configKey} class={field.rowClass}>
                                            <td>
                                                <input
                                                    type="checkbox"
                                                    checked={field.enabled}
                                                    data-key={field.configKey}
                                                    onchange={handleFieldToggle} />
                                            </td>
                                            <td><div class="slds-truncate">{field.fieldApiName}</div></td>
                                            <td>
                                                <div class="slds-truncate">
                                                    <template if:true={field.isContentDoc}>
                                                        <span class="slds-badge slds-badge_inverse">{field.patternType}</span>
                                                    </template>
                                                    <template if:false={field.isContentDoc}>
                                                        <span class="slds-badge">{field.patternType}</span>
                                                    </template>
                                                </div>
                                            </td>
                                            <td>
                                                <div class="slds-truncate">
                                                    {field.recordTypeDeveloperName}
                                                </div>
                                            </td>
                                            <td>
                                                <input
                                                    type="checkbox"
                                                    checked={field.deleteHistory}
                                                    disabled={field.isContentDoc}
                                                    data-key={field.configKey}
                                                    onchange={handleDeleteHistoryToggle} />
                                            </td>
                                            <td><div class="slds-truncate">{field.patternDescription}</div></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                </div>
            </template>

            <!-- ── Error ─────────────────────────────────────────────────── -->
            <template if:true={errorMessage}>
                <div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_medium" role="alert">
                    <lightning-icon icon-name="utility:error" size="small" class="slds-m-right_x-small"></lightning-icon>
                    {errorMessage}
                </div>
            </template>

            <!-- ── Launch button ─────────────────────────────────────────── -->
            <div class="slds-m-bottom_large">
                <lightning-button
                    label={startLabel}
                    variant="destructive"
                    icon-name="utility:shield"
                    disabled={isStartDisabled}
                    onclick={handleStart}>
                </lightning-button>
                <template if:true={isRunning}>
                    <lightning-spinner
                        alternative-text="Running..."
                        size="small"
                        class="slds-m-left_small">
                    </lightning-spinner>
                </template>
            </div>

            <!-- ── Audit log ─────────────────────────────────────────────── -->
            <div class="slds-m-top_large">
                <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                    <h3 class="slds-text-heading_small">Recent Runs</h3>
                    <lightning-button-icon
                        icon-name="utility:refresh"
                        alternative-text="Refresh"
                        onclick={handleRefreshLogs}>
                    </lightning-button-icon>
                </div>

                <template if:true={hasAuditLogs}>
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th><div class="slds-truncate">Log #</div></th>
                                <th><div class="slds-truncate">Object(s)</div></th>
                                <th><div class="slds-truncate">Brands</div></th>
                                <th><div class="slds-truncate">Status</div></th>
                                <th><div class="slds-truncate">Processed</div></th>
                                <th><div class="slds-truncate">Failed</div></th>
                                <th><div class="slds-truncate">By</div></th>
                                <th><div class="slds-truncate">Started</div></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={auditLogs} for:item="log">
                                <tr key={log.Id}>
                                    <td><div class="slds-truncate">{log.Name}</div></td>
                                    <td><div class="slds-truncate">{log.TEKCO_ObjectApiName__c}</div></td>
                                    <td><div class="slds-truncate">{log.TEKCO_BrandFilter__c}</div></td>
                                    <td><span class={log.statusClass}>{log.TEKCO_Status__c}</span></td>
                                    <td><div class="slds-truncate">{log.TEKCO_RecordsProcessed__c}</div></td>
                                    <td><div class="slds-truncate">{log.TEKCO_RecordsFailed__c}</div></td>
                                    <td><div class="slds-truncate">{log.TEKCO_TriggeredBy__r.Name}</div></td>
                                    <td><div class="slds-truncate">{log.startFormatted}</div></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>
                <template if:false={hasAuditLogs}>
                    <p class="slds-text-color_weak slds-m-top_small">No runs yet.</p>
                </template>
            </div>

        </div>

        </lightning-tab>

        <!-- ════════════════════════════════════════════════════════════════════
             TAB 2 — By ID (DataMig)
             ════════════════════════════════════════════════════════════════════ -->
        <lightning-tab label="By ID (DataMig)">
            <div class="slds-p-around_medium">

                <!-- Permission warning -->
                <template if:true={permissionWarning}>
                    <div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_medium" role="alert">
                        <lightning-icon icon-name="utility:error" size="small" class="slds-m-right_x-small"></lightning-icon>
                        {permissionWarning}
                    </div>
                </template>

                <!-- Resolve mode selector -->
                <div class="slds-grid slds-gutters slds-m-bottom_medium">
                    <div class="slds-col slds-size_1-of-3">
                        <lightning-combobox
                            label="Resolution mode"
                            value={byIdResolveMode}
                            options={resolveModeOptions}
                            onchange={handleByIdResolveModeChange}>
                        </lightning-combobox>
                    </div>

                    <!-- External ID selectors — visible only in EXTERNAL_ID mode -->
                    <template if:true={isExternalIdMode}>
                        <div class="slds-col slds-size_1-of-3">
                            <lightning-combobox
                                label="Target object"
                                placeholder="Select object..."
                                value={byIdTargetObject}
                                options={byIdObjectOptions}
                                onchange={handleByIdTargetObjectChange}>
                            </lightning-combobox>
                        </div>
                        <div class="slds-col slds-size_1-of-3">
                            <lightning-combobox
                                label="External ID field"
                                placeholder="Select field..."
                                value={byIdExternalIdField}
                                options={byIdExternalIdFieldOptions}
                                disabled={byIdExternalIdFieldDisabled}
                                onchange={handleByIdExternalIdFieldChange}>
                            </lightning-combobox>
                        </div>
                    </template>
                </div>

                <!-- ID input -->
                <div class="slds-form-element slds-m-bottom_medium">
                    <label class="slds-form-element__label" for="byid-input">
                        Record IDs / External IDs
                        <span class="slds-text-body_small slds-text-color_weak slds-m-left_x-small">
                            (one per line, or comma / semicolon separated)
                        </span>
                    </label>
                    <div class="slds-form-element__control">
                        <textarea
                            id="byid-input"
                            class="slds-textarea"
                            rows="8"
                            placeholder="001XXXXXXXXXXXXXXX&#10;003XXXXXXXXXXXXXXX&#10;..."
                            value={byIdRawInput}
                            onchange={handleByIdInputChange}>
                        </textarea>
                    </div>
                    <p class="slds-form-element__help slds-m-top_xx-small">{byIdParsedCountLabel}</p>
                </div>

                <!-- Resolve button -->
                <div class="slds-m-bottom_medium">
                    <lightning-button
                        label="Preview Scope"
                        icon-name="utility:preview"
                        disabled={isByIdResolveDisabled}
                        onclick={handleByIdResolve}>
                    </lightning-button>
                    <template if:true={isByIdResolving}>
                        <lightning-spinner alternative-text="Resolving..." size="small" class="slds-m-left_small"></lightning-spinner>
                    </template>
                </div>

                <!-- Resolve result -->
                <template if:true={hasByIdResolveResult}>
                    <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                        <h3 class="slds-text-heading_small slds-m-bottom_small">Scope Preview</h3>

                        <template if:true={hasByIdDirectObjects}>
                            <p class="slds-text-title_caps slds-m-bottom_xx-small">Direct records</p>
                            <template for:each={byIdResolveResult.directObjects} for:item="obj">
                                <div key={obj.objectApiName} class="slds-grid slds-m-bottom_xx-small">
                                    <div class="slds-col slds-size_1-of-2"><strong>{obj.objectApiName}</strong></div>
                                    <div class="slds-col"><span class="slds-badge">{obj.recordCount} record(s)</span></div>
                                </div>
                            </template>
                        </template>

                        <template if:true={hasByIdChildObjects}>
                            <p class="slds-text-title_caps slds-m-top_small slds-m-bottom_xx-small">Resolved children</p>
                            <template for:each={byIdResolveResult.childObjects} for:item="obj">
                                <div key={obj.objectApiName} class="slds-grid slds-m-bottom_xx-small">
                                    <div class="slds-col slds-size_1-of-2"><strong>{obj.objectApiName}</strong></div>
                                    <div class="slds-col">
                                        <span class="slds-badge">{obj.recordCount} record(s)</span>
                                        <span class="slds-text-body_small slds-text-color_weak slds-m-left_x-small">{obj.sourceLabel}</span>
                                    </div>
                                </div>
                            </template>
                        </template>

                        <template if:true={hasByIdInvalidIds}>
                            <div class="slds-notify slds-notify_alert slds-theme_warning slds-m-top_small" role="alert">
                                <lightning-icon icon-name="utility:warning" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                <strong>{byIdResolveResult.invalidIds.length} ID(s) skipped</strong>
                                <ul class="slds-list_dotted slds-m-top_xx-small">
                                    <template for:each={byIdResolveResult.invalidIds} for:item="inv">
                                        <li key={inv} class="slds-text-body_small">{inv}</li>
                                    </template>
                                </ul>
                            </div>
                        </template>

                        <template if:false={hasByIdAnyValid}>
                            <p class="slds-text-color_error">
                                No valid configured IDs found. Check that the objects are active in TEKCO_AnonymizationFieldConfig__mdt.
                            </p>
                        </template>
                    </div>
                </template>

                <!-- Fields to Anonymize table (shown after resolve) -->
                <template if:true={hasByIdFieldConfigs}>
                    <div class="slds-m-bottom_medium">
                        <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                            <h3 class="slds-text-heading_small">
                                Fields to Anonymize
                                <span class="slds-text-body_small slds-text-color_weak slds-m-left_x-small">
                                    (uncheck to bypass a field for this run)
                                </span>
                            </h3>
                            <div class="slds-text-body_small">
                                <span class="slds-m-right_medium">
                                    Run:
                                    <lightning-button label="Select All" variant="base" onclick={handleByIdSelectAllFields}></lightning-button>
                                    /
                                    <lightning-button label="Deselect All" variant="base" onclick={handleByIdDeselectAllFields}></lightning-button>
                                </span>
                                <span>
                                    Del. History:
                                    <lightning-button label="Select All" variant="base" onclick={handleByIdSelectAllHistory}></lightning-button>
                                    /
                                    <lightning-button label="Deselect All" variant="base" onclick={handleByIdDeselectAllHistory}></lightning-button>
                                </span>
                            </div>
                        </div>
                        <div class="slds-grid slds-gutters_x-small slds-m-bottom_small">
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input
                                    type="search"
                                    label="Filter by field name"
                                    placeholder="Type to filter..."
                                    value={byIdFieldFilterText}
                                    onchange={handleByIdFieldFilterChange}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-combobox
                                    label="Filter by Record Type"
                                    value={byIdFieldFilterRT}
                                    options={byIdFieldFilterRtOptions}
                                    onchange={handleByIdFieldFilterRtChange}>
                                </lightning-combobox>
                            </div>
                        </div>
                        <template for:each={byIdFieldConfigsByObject} for:item="group">
                            <div key={group.objectApiName} class="slds-m-bottom_small">
                                <p class="slds-text-title_caps slds-m-bottom_xx-small">{group.objectApiName}</p>
                                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                                    <thead>
                                        <tr class="slds-line-height_reset">
                                            <th style="width:3rem"><div class="slds-truncate">Run</div></th>
                                            <th><div class="slds-truncate">Field</div></th>
                                            <th><div class="slds-truncate">Pattern</div></th>
                                            <th><div class="slds-truncate">Record Type</div></th>
                                            <th style="width:5rem"><div class="slds-truncate">Del. History</div></th>
                                            <th><div class="slds-truncate">Description</div></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={group.fields} for:item="field">
                                            <tr key={field.configKey} class={field.rowClass}>
                                                <td>
                                                    <input
                                                        type="checkbox"
                                                        checked={field.enabled}
                                                        data-key={field.configKey}
                                                        onchange={handleByIdFieldToggle} />
                                                </td>
                                                <td><div class="slds-truncate">{field.fieldApiName}</div></td>
                                                <td>
                                                    <div class="slds-truncate">
                                                        <template if:true={field.isContentDoc}>
                                                            <span class="slds-badge slds-badge_inverse">{field.patternType}</span>
                                                        </template>
                                                        <template if:false={field.isContentDoc}>
                                                            <span class="slds-badge">{field.patternType}</span>
                                                        </template>
                                                    </div>
                                                </td>
                                                <td><div class="slds-truncate">{field.recordTypeDeveloperName}</div></td>
                                                <td>
                                                    <input
                                                        type="checkbox"
                                                        checked={field.deleteHistory}
                                                        disabled={field.isContentDoc}
                                                        data-key={field.configKey}
                                                        onchange={handleByIdDeleteHistoryToggle} />
                                                </td>
                                                <td><div class="slds-truncate">{field.patternDescription}</div></td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- Error -->
                <template if:true={byIdErrorMessage}>
                    <div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_medium" role="alert">
                        <lightning-icon icon-name="utility:error" size="small" class="slds-m-right_x-small"></lightning-icon>
                        {byIdErrorMessage}
                    </div>
                </template>

                <!-- Launch button -->
                <div class="slds-m-bottom_large">
                    <lightning-button
                        label={byIdLaunchLabel}
                        variant="destructive"
                        icon-name="utility:shield"
                        disabled={isByIdLaunchDisabled}
                        onclick={handleByIdLaunch}>
                    </lightning-button>
                    <template if:true={isByIdRunning}>
                        <lightning-spinner alternative-text="Running..." size="small" class="slds-m-left_small"></lightning-spinner>
                    </template>
                </div>

                <!-- Audit log — BY_ID runs only -->
                <div class="slds-m-top_large">
                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                        <h3 class="slds-text-heading_small">Recent Runs</h3>
                        <lightning-button-icon icon-name="utility:refresh" alternative-text="Refresh" onclick={handleByIdRefreshLogs}></lightning-button-icon>
                    </div>
                    <template if:true={hasByIdAuditLogs}>
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th><div class="slds-truncate">Log #</div></th>
                                    <th><div class="slds-truncate">Object(s)</div></th>
                                    <th><div class="slds-truncate">Scope</div></th>
                                    <th><div class="slds-truncate">Status</div></th>
                                    <th><div class="slds-truncate">Processed</div></th>
                                    <th><div class="slds-truncate">Failed</div></th>
                                    <th><div class="slds-truncate">By</div></th>
                                    <th><div class="slds-truncate">Started</div></th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={byIdAuditLogs} for:item="log">
                                    <tr key={log.Id}>
                                        <td><div class="slds-truncate">{log.Name}</div></td>
                                        <td><div class="slds-truncate">{log.TEKCO_ObjectApiName__c}</div></td>
                                        <td><div class="slds-truncate">{log.TEKCO_BrandFilter__c}</div></td>
                                        <td><span class={log.statusClass}>{log.TEKCO_Status__c}</span></td>
                                        <td><div class="slds-truncate">{log.TEKCO_RecordsProcessed__c}</div></td>
                                        <td><div class="slds-truncate">{log.TEKCO_RecordsFailed__c}</div></td>
                                        <td><div class="slds-truncate">{log.TEKCO_TriggeredBy__r.Name}</div></td>
                                        <td><div class="slds-truncate">{log.startFormatted}</div></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </template>
                    <template if:false={hasByIdAuditLogs}>
                        <p class="slds-text-color_weak slds-m-top_small">No BY_ID runs yet.</p>
                    </template>
                </div>

            </div>
        </lightning-tab>

        </lightning-tabset>

        <!-- ── Confirmation modal — By Criteria (outside tabset so it overlays everything) ── -->
        <template if:true={showConfirmPanel}>
            <section
                role="dialog"
                tabindex="-1"
                aria-modal="true"
                aria-labelledby="confirm-modal-heading"
                class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">

                    <header class="slds-modal__header slds-theme_alert-texture slds-theme_error">
                        <lightning-icon
                            icon-name="utility:warning"
                            size="small"
                            variant="inverse"
                            class="slds-m-right_x-small">
                        </lightning-icon>
                        <h2 id="confirm-modal-heading" class="slds-text-heading_medium">
                            Confirm Anonymization
                        </h2>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium">
                        <p class="slds-text-color_error slds-m-bottom_medium">
                            <strong>WARNING: this operation is IRREVERSIBLE. Data will be permanently overwritten.</strong>
                        </p>
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                            <tbody>
                                <template for:each={confirmSummaryLines} for:item="line">
                                    <tr key={line.key}>
                                        <th class="slds-size_1-of-3" style="font-weight:600">{line.label}</th>
                                        <td>{line.value}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>

                    <footer class="slds-modal__footer">
                        <lightning-button
                            label="Cancel"
                            variant="neutral"
                            onclick={handleCancelLaunch}>
                        </lightning-button>
                        <lightning-button
                            label="Confirm Launch"
                            variant="destructive"
                            class="slds-m-left_x-small"
                            onclick={handleConfirmLaunch}>
                        </lightning-button>
                    </footer>

                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- ── Confirmation modal — By ID (outside tabset so it overlays everything) ── -->
        <template if:true={showByIdConfirmPanel}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="byid-confirm-heading"
                class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header slds-theme_alert-texture slds-theme_error">
                        <lightning-icon icon-name="utility:warning" size="small" variant="inverse" class="slds-m-right_x-small"></lightning-icon>
                        <h2 id="byid-confirm-heading" class="slds-text-heading_medium">Confirm Anonymization by ID</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p class="slds-text-color_error slds-m-bottom_medium">
                            <strong>WARNING: this operation is IRREVERSIBLE. Data will be permanently overwritten.</strong>
                        </p>
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                            <tbody>
                                <template for:each={byIdConfirmSummaryLines} for:item="line">
                                    <tr key={line.key}>
                                        <th class="slds-size_1-of-3" style="font-weight:600">{line.label}</th>
                                        <td>{line.value}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" variant="neutral" onclick={handleByIdCancelLaunch}></lightning-button>
                        <lightning-button label="Confirm Launch" variant="destructive" class="slds-m-left_x-small" onclick={handleByIdConfirmLaunch}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </lightning-card>

</template>
